<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BELA – Teman Hukum Kamu (full clone)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#0d2154;--mid:#1a3a6b;--soft:#93c5fd;--accent:#e8960a;--ink:#111827;--body:#374151;--strong:#1f2937;--muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line2:#f3f4f6;--app:#eef2f8;--page:#f8fafc;--ok:#059669;--okbg:#f0fdf4;--okb:#d1fae5;--okt:#065f46;--danger:#dc2626;--dbg:#fef2f2;--db:#fecaca;--dt:#991b1b;--notice:#fef3dc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;background:var(--app);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh;background:#fff;max-width:1100px;margin:0 auto;position:relative;overflow:hidden}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;background:var(--page)}
.pad{padding:12px 16px 20px}
/* home header */
.top{background:#fff;padding:12px 16px}
.top-row{display:flex;align-items:center;justify-content:space-between;height:36px;margin-top:-12px}
.logo{height:36px;width:auto;display:block}
.quota{display:flex;align-items:center;gap:6px;background:var(--okbg);border:1px solid var(--okb);border-radius:99px;padding:4px 10px;font-size:10px;font-weight:600;color:var(--okt)}
.quota i{width:6px;height:6px;border-radius:50%;background:#10b981}
.bell{width:28px;height:28px;border-radius:50%;background:var(--line2);display:grid;place-items:center;margin-left:8px}
.bell svg{width:14px;height:14px}
.right{display:flex;align-items:center}
.hello{font-size:12px;color:var(--faint);margin-top:12px}
.name{font-size:20px;font-weight:800;margin-top:2px}
/* navy header */
.nh{background:var(--primary);color:#fff;padding:14px 16px 14px;flex-shrink:0}
.nh h1{font-size:17px;font-weight:800}
.nh p{font-size:11px;color:var(--soft);margin-top:3px}
.nh .back{display:flex;align-items:center;gap:12px}
.nh .back button{color:#fff;font-size:18px;line-height:1}
.nh.big{padding-bottom:18px}
.nh .sub2{font-size:15px;font-weight:800;margin-top:14px}
/* tabs */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.tabs button{padding:12px 14px;font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--primary);border-color:var(--primary)}
/* generic */
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.sec h3{font-size:16px;font-weight:700}
.see{font-size:12px;font-weight:600;color:var(--primary)}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(15,23,42,.08);padding:14px}
.hero{position:relative;height:180px;border-radius:16px;overflow:hidden;background:#dbeafe;display:flex;align-items:center;width:100%;text-align:left}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:80% 30%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(235,244,255,.96),rgba(235,244,255,.85) 28%,rgba(235,244,255,0) 62%)}
.hero div{position:relative;z-index:2;padding:0 20px}.hero h2{font-size:24px;font-weight:800;color:var(--primary)}.hero p{font-size:13px;color:var(--body);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.svc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100px;border-radius:14px;box-shadow:0 1px 4px rgba(15,23,42,.08);transition:.15s}
.svc:hover{transform:translateY(-2px)}
.svc img{height:44px}.svc span{font-size:11px;font-weight:600;color:var(--strong);text-align:center}
.c1{background:#fef0f0}.c2{background:#fff9e6}.c3{background:#eafaf1}.c4{background:#fefce8}.c5{background:#f3f1ff}.c6{background:#edf4ff}
.upg{position:relative;overflow:hidden;margin-top:20px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--mid));color:#fff;padding:20px 16px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:106px;width:100%}
.upg .l{font-size:12px;font-weight:600;color:var(--accent)}.upg .t{font-size:18px;font-weight:800;margin-top:2px}.upg .s{font-size:12px;color:var(--soft);margin-top:4px;line-height:1.4}
.upg .b{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:#fff;color:var(--primary);font-weight:800;font-size:14px;padding:11px 14px;border-radius:12px}
.art{display:flex;background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(15,23,42,.08);overflow:hidden;margin-bottom:10px;min-height:104px;position:relative;width:100%;text-align:left}
.art .th{width:97px;background:var(--app);flex-shrink:0;display:grid;place-items:center;font-size:30px}
.art .bd{padding:12px 44px 12px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tag{align-self:flex-start;font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;background:#f3e8ff;color:#6b21a8}
.tag.g{background:#dcfce7;color:#166534}
.art h4{font-size:13px;font-weight:700;margin-top:6px}.art p{font-size:10.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.art time{font-size:9.5px;color:var(--faint);margin-top:6px}
.go{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:12px;color:var(--faint)}
/* bottom nav */
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 0 10px;flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--faint);position:relative}
.tab svg{width:18px;height:18px;fill:currentColor}
.tab.on{color:var(--primary);font-weight:700}.tab.on:after{content:"";position:absolute;bottom:-5px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
/* layanan list */
.li{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(15,23,42,.08);padding:14px;margin-bottom:12px;width:100%;text-align:left;position:relative}
.li .ic{width:44px;height:44px;border-radius:12px;background:var(--line2);display:grid;place-items:center;flex-shrink:0;font-size:24px}
.li .ic img{width:30px;height:30px;object-fit:contain}
.li b{font-size:13px;font-weight:700}.li .pill{font-size:9px;font-weight:600;background:#eef2ff;color:var(--mid);padding:2px 8px;border-radius:99px;margin-left:6px}
.li .pill.k{background:#dcfce7;color:#166534}
.li small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.li strong{display:block;font-size:11.5px;margin-top:5px;font-weight:700}
.li .chev{margin-left:auto;color:var(--faint);font-size:14px}
/* paket */
.plan{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(15,23,42,.08);padding:14px;margin-bottom:14px;width:100%;text-align:left;position:relative}
.plan img{width:36px;height:36px}.plan b{font-size:13px}.plan .q{display:inline-block;font-size:9.5px;background:#eef2ff;color:var(--mid);padding:2px 8px;border-radius:99px;margin-top:4px}
.plan .pr{margin-left:auto;text-align:right}.plan .pr strong{font-size:15px;display:block}.plan .pr small{font-size:10px;color:var(--muted)}
.plan .go2{width:22px;height:22px;border-radius:50%;background:#e0e7ff;margin-left:auto;display:grid;place-items:center;font-size:11px;color:var(--mid);margin-top:6px}
.plan.pop{background:linear-gradient(135deg,var(--primary),var(--mid));color:#fff;border:2px solid var(--accent)}
.plan.pop .q{background:rgba(255,255,255,.15);color:#fff}.plan.pop .pr strong{color:var(--accent)}.plan.pop .pr small{color:var(--soft)}
.badge{position:absolute;top:-10px;left:12px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px}
.note{display:flex;gap:8px;background:#fff;border-radius:12px;padding:12px;font-size:11px;color:var(--muted);box-shadow:0 1px 4px rgba(15,23,42,.06)}
/* buttons / forms */
.btn{display:block;width:100%;background:var(--primary);color:#fff;font-weight:700;font-size:14px;padding:13px;border-radius:12px;text-align:center}
.btn.o{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn.acc{background:var(--accent)}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 5px;color:var(--strong)}
input,select,textarea{width:100%;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--mid)}
.chk{display:flex;gap:10px;font-size:12.5px;color:var(--body);margin:9px 0;line-height:1.4}.chk i{color:var(--ok);font-style:normal;font-weight:800}
.warn{background:var(--notice);border-radius:12px;padding:12px;font-size:11.5px;color:#7a4b00;line-height:1.45}
.alert{background:var(--dbg);border:1px solid var(--db);color:var(--dt);border-radius:12px;padding:12px;font-size:12px;line-height:1.45}
.step{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;background:#fff;font-size:11px;color:var(--faint);font-weight:600}
.step span{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.step span.on{background:var(--primary);color:#fff}.step u{width:26px;height:2px;background:var(--line)}
.opt{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.opt.on{border-color:var(--primary);background:#f4f7ff}
.opt .e{font-size:22px}.opt b{font-size:13px;display:block}.opt small{font-size:11px;color:var(--muted)}
/* chat */
.chat{flex:1;overflow-y:auto;background:var(--app);padding:14px}
.disc{background:var(--notice);font-size:10.5px;color:#7a4b00;padding:8px 14px;flex-shrink:0}
.msg{display:flex;gap:8px;margin-bottom:12px}.av{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.bub{background:#fff;border-radius:4px 14px 14px 14px;padding:11px 13px;font-size:12.5px;line-height:1.5;max-width:82%;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bub.me{background:var(--primary);color:#fff;border-radius:14px 4px 14px 14px;margin-left:auto}
.bub time{display:block;font-size:9px;color:var(--faint);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px 38px}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:11.5px;font-weight:600;color:var(--primary)}
.faq{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 8px 38px}
.faqi{display:block;margin:0 0 8px 38px;background:#fff;border-radius:12px;padding:11px 13px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);text-align:left;width:calc(100% - 38px)}
.compose{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line);flex-shrink:0}
.compose input{border-radius:99px}.send{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;font-size:16px;flex-shrink:0}
/* profile */
.pf{background:var(--primary);color:#fff;padding:14px 16px 56px;flex-shrink:0}
.pf h1{font-size:17px;font-weight:800}
.pfu{display:flex;gap:12px;align-items:center;margin-top:14px}.pfa{width:48px;height:48px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:17px}
.pfu b{font-size:14px}.pfu small{display:block;font-size:11px;color:var(--soft)}
.pc{background:#fff;border-radius:16px;margin:-40px 12px 0;padding:14px;box-shadow:0 2px 10px rgba(15,23,42,.1)}
.pc .r{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.pc h2{font-size:15px;font-weight:800;margin-top:10px}.pc .n{font-size:20px;font-weight:800;text-align:right;margin-top:-30px}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--primary)}
.grp{font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.06em;margin:18px 16px 6px}
.menu{background:#fff;border-radius:14px;margin:0 12px;box-shadow:0 1px 5px rgba(15,23,42,.06);overflow:hidden}
.mi{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line2);width:100%;text-align:left}.mi:last-child{border:0}
.mi .e{font-size:20px;width:26px;text-align:center}.mi b{font-size:13px;font-weight:600;display:block}.mi small{font-size:10.5px;color:var(--faint)}.mi .c{margin-left:auto;color:var(--faint)}
.ft{text-align:center;font-size:10.5px;color:var(--faint);padding:18px;line-height:1.7}
.dg{display:block;margin:12px;text-align:center;font-size:13px;font-weight:700;color:var(--danger)}
/* sheet */
.ov{position:absolute;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;z-index:20;animation:f .2s}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:82%;overflow-y:auto;padding:20px 18px 24px;animation:u .25s}
.sheet h3{font-size:16px;font-weight:800;margin-bottom:10px}.sheet h5{font-size:12.5px;font-weight:700;margin:14px 0 4px}.sheet p,.sheet li{font-size:12px;color:var(--body);line-height:1.55}
.sheet ul{padding-left:18px}
@keyframes u{from{transform:translateY(40px);opacity:0}}@keyframes f{from{opacity:0}}
/* emptiness */
.empty{text-align:center;color:var(--faint);font-size:13px;padding:80px 20px}.empty div{font-size:46px;opacity:.55;margin-bottom:8px}
.t{font-size:13px;font-weight:700}
.letter{background:#fff;border-radius:12px;padding:16px;font-size:12px;line-height:1.7;border:1px solid var(--line);white-space:pre-line}
.emg{background:var(--dbg);border:1px solid var(--db);color:var(--dt);border-radius:12px;padding:12px;font-size:12px;display:flex;gap:10px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--line2)}.row:last-child{border:0}.row b{color:var(--primary)}
.big{font-size:12px}
.res{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:14px;margin-top:14px;font-size:12.5px;line-height:1.7}
.res strong{font-size:18px;display:block;color:#14532d}
.price{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:13px;margin:14px 0;box-shadow:0 1px 4px rgba(15,23,42,.06);font-size:12px}.price b{font-size:16px;color:var(--primary)}
.upl{border:2px dashed #c7d2fe;border-radius:14px;padding:26px;text-align:center;color:var(--muted);font-size:12px;background:#f8faff}
@media(max-width:520px){.hero{height:150px}.hero h2{font-size:20px}.svc{height:92px}.svc img{height:38px}.upg .b{position:static;transform:none;margin-left:12px}.upg{justify-content:space-between}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const IMG=n=>`https://www.belahukum.com/figma/image-${n}.png`;
const $=s=>document.querySelector(s);
const chev='›';
// ---- state ----
let state={riwayatTab:'Tanya BELA',antiTab:'Panduan',kerjaTab:'Kalkulator Pesangon',konsTab:'Konsumen',suratStep:1,suratType:null,sheet:null,article:null,doc:null};
const user={name:'Nama Pengguna',ini:'NP',phone:'62812XXXXXXXX'};

// ---- shared pieces ----
const navItems=[['/','Beranda','<path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/>'],['/layanan','Layanan','<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'],['/riwayat','Riwayat','<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5.2l4 2.4-.8 1.3L11 13V7z"/>'],['/profil','Profil','<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>']];
const bottomNav=p=>`<nav class="nav">${navItems.map(([h,l,d])=>`<button class="tab ${p===h?'on':''}" onclick="go('${h}')"><svg viewBox="0 0 24 24">${d}</svg>${l}</button>`).join('')}</nav>`;
const sub=(title,back,subtitle='')=>`<div class="nh"><div class="back"><button onclick="${back?`go('${back}')`:'history.back()'}">←</button><div><h1>${title}</h1>${subtitle?`<p>${subtitle}</p>`:''}</div></div></div>`;
const tabs=(list,key)=>`<div class="tabs">${list.map(t=>`<button class="${state[key]===t?'on':''}" onclick="state.${key}='${t}';render()">${t}</button>`).join('')}</div>`;
const sheet=(html)=>`<div class="ov" onclick="if(event.target===this){state.sheet=null;render()}"><div class="sheet">${html}<button class="btn" style="margin-top:16px" onclick="state.sheet=null;render()">Tutup</button></div></div>`;
const bell='<svg viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>';
const cta=(a,b)=>`<div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">${a}${b||''}</div>`;
const toast=m=>alert(m+'\n\n(Demo clone — fitur ini tidak aktif)');

// ---- pages ----
const pages={};

pages['/']=()=>`<div class="view"><div class="top"><div class="top-row"><img class="logo" src="${IMG(10)}" alt="BELA"><div class="right"><span class="quota"><i></i>Harian · 10 tersisa</span><button class="bell">${bell}</button></div></div><p class="hello">Selamat malam,</p><h1 class="name">${user.name} 👋</h1></div>
<div class="scroll pad" style="padding-top:8px">
<button class="hero" onclick="go('/tanya')"><img src="${IMG(2)}" alt=""><div><h2>Tanya BELA</h2><p>Ada masalah hukum?<br>Ceritakan di sini</p></div></button>
<div class="sec"><h3>Layanan Hukum</h3><button class="see" onclick="go('/layanan')">Lihat semua ›</button></div>
<div class="grid">
<button class="svc c1" onclick="go('/anti-pinjol')"><img src="${IMG(24)}"><span>Anti-Pinjol</span></button>
<button class="svc c2" onclick="go('/bela-kerja')"><img src="${IMG(5)}"><span>BELA Kerja</span></button>
<button class="svc c3" onclick="go('/waris-tanah')"><img src="${IMG(6)}"><span>Waris &amp; Tanah</span></button>
<button class="svc c4" onclick="go('/konsumen-kdrt')"><img src="${IMG(27)}"><span>Konsumen &amp; KDRT</span></button>
<button class="svc c5" onclick="go('/advokat')"><img src="${IMG(32)}"><span>Konsultasi Advokat</span></button>
<button class="svc c6" onclick="go('/surat')"><img src="${IMG(9)}"><span>Draft Surat</span></button></div>
<button class="upg" onclick="go('/paket')"><div><div class="l">Paket Aktif — BELA Harian</div><div class="t">Upgrade ke Bulanan</div><div class="s">500 pertanyaan + 3x review dokumen<br>Rp 29.000/bln</div></div><span class="b">👑 Upgrade</span></button>
<div class="sec"><h3>📚 Bekal Hukum Hari Ini</h3><button class="see" onclick="go('/bekal')">Lihat semua ›</button></div>
${articles.map((a,i)=>artCard(a,i)).join('')}
</div>${bottomNav('/')}</div>`;

const articles=[

function hitung(){const g=+k1.value||0,tj=+k2.value||0,th=+k3.value||0,j=k4.value;const base=g+tj;
 const mult=th<1?1:Math.min(9,Math.floor(th)+1);
 const upmk=th<3?0:th<6?2:th<9?3:th<12?4:th<15?5:th<18?6:th<21?7:th<24?8:10;
 const f={'Efisiensi':.5,'Perampingan':1,'PHK Biasa':1,'Pensiun':1.75,'Penutupan Perusahaan':.5}[j];
 const pes=base*mult*f, up=base*upmk, hak=(pes+up)*.15, tot=pes+up+hak, r=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
 $('#hasil').innerHTML=`<div class="res"><div>Uang pesangon: ${r(pes)}</div><div>Uang penghargaan masa kerja: ${r(up)}</div><div>Penggantian hak (15%): ${r(hak)}</div><strong>Estimasi total ${r(tot)}</strong><small style="color:#4b7a5a">Perhitungan ilustrasi untuk demo, bukan hitungan resmi.</small></div>`}

// ---- router ----
function route(){const h=location.hash.replace(/^#/,'')||'/';return pages[h]?h:'/'}
function go(p){location.hash=p}
function render(){const p=route();$('#app').innerHTML=pages[p]();}
window.addEventListener('hashchange',()=>{const p=route();if(p!=='/bekal')state.article=null;if(p!=='/surat'){state.suratStep=1;state.suratType=null}state.sheet=null;render()});
